name: Sync Build to S3

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Environment: ${{ github.environment }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271776746443:role/s3-deploy
          aws-region: ap-south-1

      - name: Sync static assets with long cache
        run: |
          aws s3 sync . s3://github-actions-oidc-oct12 \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude "LICENSE" \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync index.html with no cache
        run: |
          aws s3 cp index.html s3://github-actions-oidc-oct12/index.html \
            --cache-control "no-cache"
